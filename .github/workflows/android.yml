# Builds the Android APK on GitHub's own runners.
#
# The development sandbox this app was written in cannot reach dl.google.com — the host the
# Android SDK and Google's Maven repository are served from — so no APK could ever be built
# there. GitHub-hosted runners can, and doing it here has a second benefit: every change to
# the native code is now compiled by something, which until this existed was nothing at all.
#
# The result is a debug APK, attached to each run as a downloadable artifact. It installs by
# sideloading; a store build needs a release signing key, which belongs in repository secrets
# and isn't set up here.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older build pointless.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Where Android keeps its per-user files, including the debug signing key. Set outright so
      # the build and the cache below can't disagree about where it is — the first attempt cached
      # ~/.android and the key wasn't there, so nothing was saved.
      ANDROID_USER_HOME: /home/runner/android-user
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Seconds, and it stops a broken app from being packaged at all.
      - name: Unit tests
        run: npm test

      - name: Build the web app
        env:
          # The project this app backs up to and updates from, built into the app so nobody types it in. Both are
          # public by design (the anon key grants nothing without a sign-in); a service key here fails the build.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Pinned explicitly rather than trusting whatever the runner image happens to carry:
      # compileSdk is 36 in android/variables.gradle.
      # Its default package list still includes "tools", which the SDK repository no longer
      # carries — left at the default, the whole job fails on "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web app into the Android project
        run: npx cap sync android

      # Android refuses to install an app over one signed with a different key — "App not
      # installed" — and the only way round it is to uninstall, which deletes the app's data.
      # Debug builds are signed with a key Android creates the first time it needs one, and every
      # run here starts on a fresh machine, so every build got a different key and none could
      # update the last. Remembering the key between runs fixes that. It's kept in the Actions
      # cache rather than in the repository on purpose: the repository is public, and a signing
      # key published there would let anyone sign an "update" that a phone would accept.
      - name: Remember the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_USER_HOME }}/debug.keystore
          key: android-debug-keystore-v1

      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # The fingerprint of the key this build was signed with. Two builds that print the same line
      # can update one another; two that don't, can't.
      - name: Show which key signed it
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate SHA-256 digest"

      - name: Name it after the commit
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "momentum-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: momentum-debug-apk
          path: momentum-[0-9a-f]*-debug.apk
          if-no-files-found: error
          retention-days: 30

      # The "lite" APK: the same app, signed with the same key, without the two things Google Play Protect refuses to
      # install from a file: permission to receive texts, and a notification listener. It updates, and is updated by,
      # the full one. The manifest is edited in place and put back afterwards.
      - name: Build the lite APK (no text or notification reading)
        run: |
          python3 .github/scripts/make-lite-manifest.py android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug --stacktrace --no-daemon
          cd .. && git checkout -- android/app/src/main/AndroidManifest.xml
          cp android/app/build/outputs/apk/debug/app-debug.apk "momentum-lite-${GITHUB_SHA::7}-debug.apk"

      - name: Check the lite APK really asks for neither
        run: |
          out="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions momentum-lite-*-debug.apk)"
          echo "$out"
          if echo "$out" | grep -q "RECEIVE_SMS"; then echo "lite APK still asks to receive texts"; exit 1; fi
          if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml momentum-lite-*-debug.apk | grep -q "NotificationListenerService"; then echo "lite APK still has the listener"; exit 1; fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs momentum-lite-*-debug.apk | grep -E "certificate SHA-256 digest"

      - uses: actions/upload-artifact@v4
        with:
          name: momentum-lite-apk
          path: momentum-lite-*-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Publishes this build for installed apps to pick up by themselves. Only from the branch you ship from
  # (main, or whatever the repository variable OTA_BRANCH names), only once the APK has built, started on
  # an emulator and passed its tests, and only if the repository has the secrets it needs: with none, this
  # does nothing and says so. The service key and the signing key are repository secrets and nowhere else;
  # neither is ever written into a file or printed.
  publish-ota:
    needs: [apk, starts-on-android, widget-on-android]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == vars.OTA_BRANCH) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
      # Passed through the environment, never pasted into the script: a commit message is text anyone could write.
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Is publishing set up?
        id: gate
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_KEY aren't set as repository secrets, so nothing is published."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.go == 'yes'
        run: npm ci

      # The same build the APK was made from, so the stamp inside it matches what is published.
      - if: steps.gate.outputs.go == 'yes'
        name: Build the web app
        env:
          # The project this app backs up to and updates from, built into the app so nobody types it in. Both are
          # public by design (the anon key grants nothing without a sign-in); a service key here fails the build.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - if: steps.gate.outputs.go == 'yes'
        name: Publish
        run: |
          if [ -n "$OTA_SIGNING_KEY" ]; then echo "Signing with OTA_SIGNING_KEY."; else echo "No OTA_SIGNING_KEY: publishing unsigned."; fi
          node scripts/deploy-supabase.mjs --ota --notes "$COMMIT_MESSAGE"

  # Compiling isn't starting. The first APK compiled cleanly and then sat on its startup
  # screen on a real phone, so every build is now installed and opened on an emulator, and
  # the build fails if the app never finishes starting.
  starts-on-android:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: momentum-debug-apk

      # The emulator needs hardware acceleration, which GitHub's Linux runners allow once
      # /dev/kvm is readable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, open, and wait for the app to start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            smoke-start.png
            logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  # Compiling isn't drawing either. This puts the real widget into a real widget host on an
  # emulator, gives it a snapshot the way the app does, and checks what it drew: the big counter,
  # every task in the list, the Urge buttons, and that a missing or garbled snapshot degrades to a
  # placeholder rather than "Problem loading widget". Runs alongside the build, not after it,
  # because it assembles its own debug and test APKs.
  widget-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the widget on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Just the app's own tests. The bare task also walks capacitor-cordova-android-plugins, a
          # module Capacitor generates, whose test classpath trips the Kotlin duplicate-class check
          # and which has no tests of its own.
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
