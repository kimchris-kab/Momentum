# Builds the Android APK on GitHub's own runners.
#
# The development sandbox this app was written in cannot reach dl.google.com — the host the
# Android SDK and Google's Maven repository are served from — so no APK could ever be built
# there. GitHub-hosted runners can, and doing it here has a second benefit: every change to
# the native code is now compiled by something, which until this existed was nothing at all.
#
# The result is a debug APK, attached to each run as a downloadable artifact. It installs by
# sideloading; a store build needs a release signing key, which belongs in repository secrets
# and isn't set up here.
name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "vite.config.js"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older build pointless.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Seconds, and it stops a broken app from being packaged at all.
      - name: Unit tests
        run: npm test

      - name: Build the web app
        run: npm run build

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Pinned explicitly rather than trusting whatever the runner image happens to carry:
      # compileSdk is 36 in android/variables.gradle.
      # Its default package list still includes "tools", which the SDK repository no longer
      # carries — left at the default, the whole job fails on "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Name it after the commit
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "momentum-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: momentum-debug-apk
          path: momentum-*-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Compiling isn't starting. The first APK compiled cleanly and then sat on its startup
  # screen on a real phone, so every build is now installed and opened on an emulator, and
  # the build fails if the app never finishes starting.
  starts-on-android:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: momentum-debug-apk

      # The emulator needs hardware acceleration, which GitHub's Linux runners allow once
      # /dev/kvm is readable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, open, and wait for the app to start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            smoke-start.png
            logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  # Compiling isn't drawing either. This puts the real widget into a real widget host on an
  # emulator, gives it a snapshot the way the app does, and checks what it drew: the big counter,
  # every task in the list, the Urge buttons, and that a missing or garbled snapshot degrades to a
  # placeholder rather than "Problem loading widget". Runs alongside the build, not after it,
  # because it assembles its own debug and test APKs.
  widget-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the widget on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd android && ./gradlew :app:dependencies --configuration debugAndroidTestRuntimeClasspath --no-daemon > ../deps.txt; grep -n -B8 "kotlin-stdlib-jdk" ../deps.txt | head -80; true
            cd android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
